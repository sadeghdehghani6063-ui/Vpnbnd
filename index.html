​<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App</title>
<script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
<style>
body { font-family: sans-serif; background: #18222d; color: #fff; text-align: center; margin: 0; padding: 20px; }
.card { background: #243348; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
button { background: #31b1dd; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
<h1>Account</h1>
<p>Remaining Data: 50 GB</p>
<p>Remaining Time: 20 Days</p>
<p>Plan Type: Premium</p>
<p>User ID: 12345678</p>
</div>
<button onclick="Telegram.WebApp.close()">Back to Bot</button>
</body>
</html>
